name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Import codesigning cert
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" build.keychain

          rm /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Setup notarytool credential
        env:
          P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.private_keys
          echo "$P8_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8

          xcrun notarytool store-credentials "Lattice" \
              --key ~/.private_keys/AuthKey_${KEY_ID}.p8 \
              --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID"

      - name: Build, sign, notarize, staple
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent Lattice.app Lattice-${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lattice-${{ github.ref_name }}
          path: Lattice-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lattice-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Bump tap cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Lattice-${GITHUB_REF_NAME}.zip"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/bryancostanich/homebrew-tap.git" tap
          cd tap

          /usr/bin/sed -i '' -E "s|^  version \"[^\"]*\"|  version \"${VERSION}\"|" Casks/lattice.rb
          /usr/bin/sed -i '' -E "s|^  sha256 \"[^\"]*\"|  sha256 \"${SHA}\"|" Casks/lattice.rb

          if git diff --quiet Casks/lattice.rb; then
            echo "Cask already at ${VERSION} with matching SHA, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lattice.rb
          git commit -m "lattice: bump to ${VERSION}"
          git push
